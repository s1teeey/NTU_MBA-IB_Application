<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台大商研・國企教授一覽</title>
<meta name="author" content="Royee Chu">
<meta name="description" content="台大商研所與國企所教授的研究專長、開課與歷年推甄面試紀錄整理。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18202B; --muted:#5B6675; --line:#DCE1E7;
  --accent:#0F6B5C; --accent-soft:#E2F0EC;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1A2029; --ink:#E7EBF0; --muted:#9AA5B3; --line:#2C3542;
  --accent:#5CC2AD; --accent-soft:#17312C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2029; --ink:#E7EBF0; --muted:#9AA5B3; --line:#2C3542;
  --accent:#5CC2AD; --accent-soft:#17312C; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding-block:48px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:grid;gap:10px;padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .code{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.card h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .go{color:var(--accent);font-weight:500;font-size:14px}
.note{font-size:13px;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="eyebrow">NTU College of Management · 推甄準備</span>
    <h1>台大商研・國企教授一覽</h1>
    <p class="lede">整理兩所專任教師的研究專長、學歷、開課，以及 106–116 學年度推甄面試中誰擔任過哪一關。</p>
  </header>

  <div class="grid">
    <a class="card" href="ba.html">
      <span class="code">Business Administration</span>
      <h2>台大商研</h2>
      <p>17 位教授・近十年面試官時間表・供應鏈相關篩選</p>
      <span class="go">進入 →</span>
    </a>
    <a class="card" href="ib.html">
      <span class="code">International Business</span>
      <h2>台大國企</h2>
      <p>22 位教授・近十年面試官時間表・經濟背景篩選</p>
      <span class="go">進入 →</span>
    </a>
  </div>

  <p class="note">面試紀錄整理自網路上公開的推甄心得文，每則都附原文連結，本站不轉載原文。教授資料與照片取自台大管理學院官方師資頁，內容以官網為準。</p>
</main>
</body>
</html>
