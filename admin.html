<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta name="robots" content="noindex,nofollow"/>
<title>後台</title>
<link href="assets/site.css?v=20261121140831" rel="stylesheet"/>
<link href="assets/admin.css?v=20261121140831" rel="stylesheet"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body class="adm">
<div id="login" class="adm-login" hidden>
  <h1>後台</h1>
  <p class="muted">貼上 GitHub token 登入。token 只存在這台電腦的瀏覽器裡。</p>
  <ol class="small muted">
    <li>開 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub › Fine-grained token</a>。</li>
    <li>Repository access 選「Only select repositories」，勾這兩個網站的 repo。</li>
    <li>Permissions › Repository › Contents 選「Read and write」，產生後複製。</li>
  </ol>
  <form id="login-form"><input id="token" type="password" placeholder="github_pat_…" autocomplete="off" required><button type="submit">登入</button></form>
  <p id="login-msg" class="adm-msg"></p>
</div>

<div id="app" class="adm-app" hidden>
  <aside class="adm-side">
    <p class="adm-site"></p>
    <p class="grp">頁面</p>
    <nav id="pages"></nav>
    <div class="adm-side-foot"><button id="layout" type="button" title="切換分頁位置"></button><a id="live" target="_blank" rel="noopener">開啟網站</a><button id="logout" type="button">登出</button></div>
  </aside>
  <section class="adm-main">
    <header class="adm-bar">
      <div class="tb" id="tb">
        <button data-cmd="bold" title="粗體 ⌘B"><b>B</b></button>
        <button data-cmd="italic" title="斜體 ⌘I"><i>I</i></button>
        <button data-cmd="underline" title="底線 ⌘U"><u>U</u></button>
        <button data-cmd="strikeThrough" title="刪除線"><s>S</s></button>
        <span class="sep"></span>
        <button data-block="h2" title="大標">H1</button>
        <button data-block="h3" title="中標">H2</button>
        <button data-block="h4" title="小標">H3</button>
        <button data-block="p" title="內文">¶</button>
        <button id="b-small" title="小字（標題旁的補充說明）"><small>小字</small></button>
        <span class="sep"></span>
        <button data-mark="" class="hl" title="紫色螢光筆"><span class="sw-c" style="--c:#8F5CF0"></span></button>
        <button data-mark="r" class="hl" title="紅色螢光筆"><span class="sw-c" style="--c:#D62648"></span></button>
        <button data-mark="g" class="hl" title="綠色螢光筆"><span class="sw-c" style="--c:#16A08A"></span></button>
        <button data-mark="k" class="hl" title="灰色螢光筆"><span class="sw-c" style="--c:#9496A3"></span></button>
        <span class="sep"></span>
        <button data-cmd="insertUnorderedList" title="項目清單">•</button>
        <button data-cmd="insertOrderedList" title="編號清單">1.</button>
        <button id="b-link" title="連結">連結</button>
        <button id="b-img" title="插入圖片">圖片</button>
        <button id="b-sec" title="新增段落區塊">＋段落</button>
        <span class="sep"></span>
        <button data-cmd="undo" title="復原 ⌘Z">↶</button>
        <button data-cmd="redo" title="重做">↷</button>
      </div>
      <div class="acts">
        <span id="state" class="adm-state"></span>
        <button id="b-restore" type="button" hidden title="找回上次放棄的草稿">找回</button><button id="b-discard" type="button" hidden title="放棄修改，回到網站上的版本">放棄</button><button id="b-preview" type="button">預覽</button>
        <button id="b-publish" type="button" class="pri" disabled title="先按預覽，確認後再發布">發布</button>
      </div>
    </header>
    <iframe id="ed" title="編輯區"></iframe>
  </section>
</div>
<input id="file" type="file" accept="image/*" hidden>
<p id="toast" class="adm-toast" role="status"></p>
<script src="assets/admin.js?v=20261121140831"></script>
</body>
</html>
