const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

/* timeline */
(function(){
  const t=$("#tl");
  const hr=t.createTHead().insertRow();
  ["學年度","第 1 關","第 2 關","第 3 關"].forEach(h=>{const th=el("th",null,h);th.scope="col";hr.appendChild(th)});
  const tb=t.createTBody();
  TL.forEach(([y,...cells])=>{
    const r=tb.insertRow();
    r.appendChild(el("td","yr",y+"（"+(y+1911-1)+"）"));
    cells.forEach(([who,kind])=>{
      const td=r.insertCell();
      who.split("、").forEach((w,i)=>{
        if(i)td.appendChild(document.createTextNode("、"));
        if(w.includes("未知"))td.appendChild(el("span","unk",w));
        else if(IN.has(w)){const b=el("button","who in",w);b.type="button";b.onclick=()=>jump(w);td.appendChild(b)}
        else td.appendChild(el("span","who out",w));
      });
      td.appendChild(el("span","kind",kind));
    });
  });
})();

/* 116: site owner's own record (questions only) */
(function(){
  const box=$("#y116");
  const h=el("div");h.appendChild(el("h3",null,"116 學年度面試題目"));
  h.appendChild(el("p","note","本站作者的面試紀錄，只列題目。"+Q116.note));box.appendChild(h);
  const g=el("div","stages");
  Q116.stages.forEach(st=>{
    const b=el("div","st");const hd=el("div","st-head");
    hd.appendChild(el("b",null,"第 "+st.s+" 關"));hd.appendChild(el("span",null,st.kind));
    if(IN.has(st.who)){const w=el("button","who in",st.who);w.type="button";w.onclick=()=>jump(st.who);hd.appendChild(w)}
    else hd.appendChild(el("span","who out",st.who));
    b.appendChild(hd);b.appendChild(el("p","how",st.how));
    if(st.topic){const t=el("p","topic","文章主題："+st.topic+" ");
      if(st.link){const a=el("a",null,"原文 ↗");a.href=st.link;a.target="_blank";a.rel="noopener";t.appendChild(a)}
      b.appendChild(t)}
    const ol=el("ol");st.q.forEach(q=>ol.appendChild(el("li",null,q)));b.appendChild(ol);
    g.appendChild(b);
  });
  box.appendChild(g);
})();
function goOwn(){
  showTab("tl");const b=$("#y116");
  b.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  b.classList.add("flash");setTimeout(()=>b.classList.remove("flash"),1600);
}


/* state */
const state={filter:"all"};
const store={
  get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},
  set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k);return true}catch(e){return false}}
};
const cards={};
function toast(t){let e=document.querySelector(".toast");if(!e){e=document.createElement("div");e.className="toast";e.setAttribute("role","status");document.body.appendChild(e)}
  e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400)}

function render(){
  const g=$("#grid");g.textContent="";
  let n=0;
  PROFS.forEach(p=>{
    const show=state.filter==="all"||(state.filter==="iv"&&p.iv.length)||(state.filter==="recent"&&p.iv.some(i=>i.y>=112))||(state.filter==="econ"&&p.econ);
    if(!show)return;n++;
    g.appendChild(card(p));
  });
  $("#count").textContent=n+" 位";
}

function card(p){
  const c=el("article","card");c.id="p-"+p.k;cards[p.n]=c;
  const top=el("div","top");
  const ph=el("div","photo");
  const img=el("img");img.alt=p.n+" 照片";img.loading="lazy";img.src="img/"+DEPT+"/"+p.k+".jpg";
  img.onerror=()=>{img.remove();ph.classList.add("empty");ph.textContent=p.n.slice(0,1)};
  ph.appendChild(img);
  top.appendChild(ph);
  const id=el("div","id");
  id.appendChild(el("h3","name",p.n));
  const tags=el("div","tags");
  tags.appendChild(el("span","tag",p.t));
  tags.appendChild(el("span","tag",p.cat));
  if(p.econ)tags.appendChild(el("span","tag ec","經濟背景"));
  if(p.iv.length)tags.appendChild(el("span","tag iv","面試官 ×"+p.iv.length));
  id.appendChild(tags);
  const l=el("div","links");const a=el("a",null,"官方師資頁 ↗");a.href=T+p.sn;a.target="_blank";a.rel="noopener";l.appendChild(a);
  const q=el("a",null,"課程查詢 ↗");q.href="https://course.ntu.edu.tw/search/quick";q.target="_blank";q.rel="noopener";
  q.title="會複製教授姓名，到台大課程網的搜尋框貼上";
  q.onclick=()=>{try{navigator.clipboard.writeText(p.n)}catch(e){}toast("已複製「"+p.n+"」，到課程網搜尋框貼上")};
  l.appendChild(q);id.appendChild(l);
  top.appendChild(id);c.appendChild(top);

  const r=el("div");r.appendChild(el("p","lbl","研究專長"));
  const ul=el("ul","res");p.res.forEach(x=>ul.appendChild(el("li",null,x)));r.appendChild(ul);c.appendChild(r);
  if(p.edu){const ed=el("div");ed.appendChild(el("p","lbl","學歷"));ed.appendChild(el("p","course",p.edu));c.appendChild(ed)}
  const co=el("div");co.appendChild(el("p","lbl",CL));co.appendChild(el("p","course",p.c));c.appendChild(co);

  const iv=el("div");iv.appendChild(el("p","lbl","面試紀錄（106–116）"));
  if(!p.iv.length)iv.appendChild(el("p","none","無紀錄"));
  else{
    const list=el("div","iv-list");
    p.iv.forEach(i=>{
      const b=el("div","iv");const h=el("div","iv-head");
      h.appendChild(el("span","iv-yr",i.y+" 學年度"));h.appendChild(el("span","iv-st","第 "+i.s+" 關"));h.appendChild(el("span","iv-kind",i.kind));
      b.appendChild(h);
      if(i.y===116){const o=el("button","who in","看 116 題目 ↓");o.type="button";o.onclick=goOwn;b.appendChild(o);list.appendChild(b);return}
      const s=el("a",null,"心得來源 ↗");s.href=SRC[i.y];s.target="_blank";s.rel="noopener";b.appendChild(s);
      list.appendChild(b);
    });
    iv.appendChild(list);
  }
  c.appendChild(iv);

  const nk=DEPT+"-note-"+p.k;
  let saved=store.get(nk);
  if(!saved){ // older version kept one box per interview record
    const old=p.iv.map(i=>store.get(DEPT+"-iv-"+p.k+"-"+i.y+"-"+i.s)).filter(Boolean);
    if(old.length){saved=old.join("\n\n");store.set(nk,saved)}
  }
  const d=el("details","note-box");d.open=!!saved;
  d.appendChild(el("summary",null,"Note"));
  const ta=el("textarea");ta.value=saved;ta.placeholder="關於這位教授的任何筆記，只會存在這台裝置";
  ta.setAttribute("aria-label",p.n+" Note");
  const sv=el("div","saved");
  let tm;ta.oninput=()=>{clearTimeout(tm);sv.textContent="編輯中…";tm=setTimeout(()=>{sv.textContent=store.set(nk,ta.value.trim())?"已存在這台裝置":"這個瀏覽器無法儲存"},600)};
  d.appendChild(ta);d.appendChild(sv);c.appendChild(d);

  return c;
}

const TABS=["cards","tl"];
function showTab(which){
  TABS.forEach(t=>{$("#tab-"+t).setAttribute("aria-selected",String(t===which));$("#panel-"+t).hidden=t!==which});
  store.set(DEPT+"-tab",which);
}
TABS.forEach(t=>$("#tab-"+t).onclick=()=>showTab(t));
{const t=store.get(DEPT+"-tab");if(TABS.includes(t))showTab(t)}

function jump(name){
  showTab("cards");
  if(!cards[name]||!cards[name].isConnected){setFilter("all")}
  const c=cards[name];if(!c)return;
  c.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1600);
}
function setFilter(f){
  state.filter=f;
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===f)));
  try{localStorage.setItem("ba-filter",f)}catch(e){}
  render();
}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>setFilter(b.dataset.f));
try{const f=localStorage.getItem("ba-filter");if(f&&document.querySelector('.chip[data-f="'+f+'"]'))state.filter=f}catch(e){}
document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===state.filter)));


render();


/* deep links: #y116 #tl #src #cards #p-<key> */
function follow(){const h=decodeURIComponent(location.hash.slice(1));
  if(h==="src"){location.replace("interview.html#src-sec");return}
  if(h==="y116")setTimeout(goOwn,50);
  else if(TABS.includes(h))showTab(h);
  else if(h.startsWith("p-")){const p=PROFS.find(x=>"p-"+x.k===h);if(p)setTimeout(()=>jump(p.n),50)}
}
follow();window.addEventListener("hashchange",follow);
